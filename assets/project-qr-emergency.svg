    <text x="28" y="226" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">KEY FEATURE</text><text x="28" y="244" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">CLAHE preprocessing for reflective badges, one-tap call and QR</text><text x="28" y="263" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">badge generation.</text>
