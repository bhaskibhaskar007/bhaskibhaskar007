<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 284" width="560" height="284" role="img" aria-label="01 ROADVISION AI">
  <defs>
    <linearGradient id="a-c01" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset="0.5" stop-color="#8b7cf7"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/></linearGradient>
    <clipPath id="k-c01"><rect width="560" height="284" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#k-c01)">
    <rect width="560" height="284" fill="#0d1117"/>
    <rect width="560" height="3" fill="#21262d"/><rect width="560" height="3" fill="url(#a-c01)"/>
    <text x="540" y="272" text-anchor="end" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="84" font-weight="800" fill="#131921">01</text>
    <text x="28" y="38" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#58a6ff">01 / ROADVISION AI</text>
    <circle cx="446" cy="34" r="3" fill="#3fb950"/><text x="532" y="38" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="1" fill="#6e7681">LIVE DEMO</text>
    <text x="28" y="68" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">PROBLEM</text><text x="28" y="86" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">Municipal road audits need a faster way to find potholes.</text>
    <text x="28" y="110" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">SOLUTION</text><text x="28" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">YOLO-based detection on images and live camera feeds, with</text><text x="28" y="147" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">severity scoring, served through a FastAPI + React web app.</text>
    <rect x="28" y="166" width="49" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="52.5" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">YOLO</text><rect x="85" y="166" width="63" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="116.5" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">OpenCV</text><rect x="156" y="166" width="70" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="191.0" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">FastAPI</text><rect x="234" y="166" width="56" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="262.0" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">React</text><rect x="298" y="166" width="92" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="344.0" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">PostgreSQL</text>
    <line x1="28" y1="206" x2="532" y2="206" stroke="#21262d"/>
    <text x="28" y="226" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">KEY FEATURE</text><text x="28" y="244" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">Low / Moderate / Critical severity scoring and auto-generated PDF</text><text x="28" y="263" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">audit reports.</text>
