<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 165" width="640" height="165" role="img" aria-label="AI Object Detection">
  <defs>
    <clipPath id="card-clip">
      <rect width="640" height="165" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card-clip)">
    <rect width="640" height="165" fill="#0d1117"/>
    <text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">AI Object Detection</text>
    <text x="616" y="33" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="1" fill="#8b949e">REAL-TIME VISION</text>
    <line x1="24" y1="46" x2="616" y2="46" stroke="#21262d" stroke-width="1"/>
    
    <text x="24" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Computer vision application that identifies objects from live camera feeds</text>
    <text x="24" y="89" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">and announces detection results aloud using offline text-to-speech.</text>
    
    <text x="24" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9"><tspan fill="#58a6ff" font-weight="600">Feature:</tspan> Confidence-gated real-time inference with dual GUI and CLI modes.</text>
    
    <rect x="24" y="128" width="56" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="52.0" y="143" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#79c0ff">YOLOv8</text>
    <rect x="88" y="128" width="56" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="116.0" y="143" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#79c0ff">OpenCV</text>
    <rect x="152" y="128" width="63" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="183.5" y="143" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#79c0ff">Tkinter</text>
    <rect x="223" y="128" width="63" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="254.5" y="143" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#79c0ff">pyttsx3</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="164" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>