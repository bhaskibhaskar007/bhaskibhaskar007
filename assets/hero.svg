<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" role="img" aria-label="Bhaskar - AI/ML Engineer and Full-Stack Developer">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.25"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="800" height="230" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="800" height="230" fill="#0d1117"/>
    <rect width="800" height="230" fill="url(#grid)"/>
    
    <!-- Accent Indicator Line -->
    <rect x="360" y="26" width="80" height="2" rx="1" fill="#58a6ff" opacity="0.8"/>
    
    <!-- Name (Strongest Visual Element) -->
    <text x="400" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="8" fill="#f0f6fc">BHASKAR</text>
    
    <!-- Disciplines -->
    <text x="400" y="122" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2.5" fill="#8b949e">AI/ML ENGINEER · COMPUTER VISION · FULL-STACK DEVELOPMENT</text>
    
    <!-- Tagline -->
    <text x="400" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#c9d1d9">Building practical AI systems from models to production applications.</text>
    
    <!-- Stack -->
    <text x="400" y="190" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="0.5" fill="#58a6ff">Python <tspan fill="#30363d">|</tspan> Machine Learning <tspan fill="#30363d">|</tspan> Computer Vision <tspan fill="#30363d">|</tspan> FastAPI <tspan fill="#30363d">|</tspan> React</text>
  </g>
  <rect x="0.5" y="0.5" width="799" height="229" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>