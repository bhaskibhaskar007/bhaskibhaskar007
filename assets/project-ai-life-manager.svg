    <clipPath id="k-c02"><rect width="560" height="284" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#k-c02)">
    <rect width="560" height="284" fill="#0d1117"/>
    <rect width="560" height="3" fill="#21262d"/><rect width="560" height="3" fill="url(#a-c02)"/>
    <text x="540" y="272" text-anchor="end" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="84" font-weight="800" fill="#131921">02</text>
    <text x="28" y="38" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#58a6ff">02 / AI LIFE MANAGER</text>
    <circle cx="446" cy="34" r="3" fill="#3fb950"/><text x="532" y="38" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="1" fill="#6e7681">LIVE DEMO</text>
    <text x="28" y="68" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">PROBLEM</text><text x="28" y="86" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">Everyday finances, tasks and plans live in separate tools.</text>
    <text x="28" y="110" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">SOLUTION</text><text x="28" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">An LLM assistant that calls expense, budget, reminder and</text><text x="28" y="147" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">weather tools over MCP, with a React dashboard.</text>
    <rect x="28" y="166" width="70" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="63.0" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">FastMCP</text><rect x="106" y="166" width="70" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="141.0" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">FastAPI</text><rect x="184" y="166" width="56" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="212.0" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">React</text><rect x="248" y="166" width="92" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="294.0" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">PostgreSQL</text><rect x="348" y="166" width="70" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="383.0" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">LLM API</text>
    <line x1="28" y1="206" x2="532" y2="206" stroke="#21262d"/>
    <text x="28" y="226" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">KEY FEATURE</text><text x="28" y="244" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">FastMCP tool server with typed schemas, JWT authentication and a</text><text x="28" y="263" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">pytest suite.</text>
