<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 165" width="640" height="165" role="img" aria-label="AI Meeting Summarizer">
  <defs>
    <clipPath id="card-clip">
      <rect width="640" height="165" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card-clip)">
    <rect width="640" height="165" fill="#0d1117"/>
    <text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">AI Meeting Summarizer</text>
    <text x="616" y="33" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="1" fill="#8b949e">SPEECH &amp; NLP</text>
    <line x1="24" y1="46" x2="616" y2="46" stroke="#21262d" stroke-width="1"/>
    
    <text x="24" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Converts meeting audio recordings into accurate text transcripts</text>
    <text x="24" y="89" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">and concise summaries, highlighting key points and action items.</text>
    
    <text x="24" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9"><tspan fill="#58a6ff" font-weight="600">Feature:</tspan> Map-reduce summarization pipeline with structured PDF export.</text>
    
    <rect x="24" y="128" width="63" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="55.5" y="143" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#79c0ff">Whisper</text>
    <rect x="95" y="128" width="97" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="143.5" y="143" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#79c0ff">Transformers</text>
    <rect x="200" y="128" width="77" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="238.5" y="143" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#79c0ff">Streamlit</text>
    <rect x="285" y="128" width="56" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="313.0" y="143" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#79c0ff">Plotly</text>
  </g>
  <rect x="0.5" y="0.5" width="639" height="164" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>