<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 284" width="560" height="284" role="img" aria-label="03 AI MEETING SUMMARIZER">
  <defs>
    <linearGradient id="a-c03" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset="0.5" stop-color="#8b7cf7"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/></linearGradient>
    <clipPath id="k-c03"><rect width="560" height="284" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#k-c03)">
    <rect width="560" height="284" fill="#0d1117"/>
    <rect width="560" height="3" fill="#21262d"/><rect width="560" height="3" fill="url(#a-c03)"/>
    <text x="540" y="272" text-anchor="end" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="84" font-weight="800" fill="#131921">03</text>
    <text x="28" y="38" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#58a6ff">03 / AI MEETING SUMMARIZER</text>
    
    <text x="28" y="68" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">PROBLEM</text><text x="28" y="86" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">Long meeting recordings are hard to review and act on.</text>
    <text x="28" y="110" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">SOLUTION</text><text x="28" y="128" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">Whisper transcription plus Transformer summarisation that pulls</text><text x="28" y="147" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">out key points, decisions and action items.</text>
    <rect x="28" y="166" width="70" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="63.0" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">Whisper</text><rect x="106" y="166" width="106" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="159.0" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">Transformers</text><rect x="220" y="166" width="85" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="262.5" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">Streamlit</text><rect x="313" y="166" width="63" height="24" rx="12" fill="#161b22" stroke="#30363d"/><text x="344.5" y="182" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#79c0ff">Plotly</text>
    <line x1="28" y1="206" x2="532" y2="206" stroke="#21262d"/>
    <text x="28" y="226" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#6e7681">KEY FEATURE</text><text x="28" y="244" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">Map/reduce summarisation for long transcripts, with</text><text x="28" y="263" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9">evidence-grounded extraction and PDF export.</text>
  </g>
</svg>